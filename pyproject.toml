[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qplace"
version = "0.1.0"
description = "Read-only Kubernetes pre-drain feasibility advisor (M1: cluster state modeling)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "jsonschema>=4.18",
]

[project.optional-dependencies]
test = ["pytest>=7"]
quantum = [
    "qiskit>=2.0,<3",
    "qiskit-optimization==0.7.*",
    "numpy>=2",
    "scipy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qplace = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
